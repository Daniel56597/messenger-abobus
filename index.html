<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abobus Messenger Premium BETA</title>
    <style>
        :root { --bg: #0e1621; --side: #17212b; --active: #2b5278; --txt: #ffffff; --accent: #2481cc; --border: #232e3c; }
        
        body, html { margin: 0; padding: 0; background: var(--bg); color: var(--txt); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            height: 100vh; width: 100vw; overflow: hidden; }

        /* Авторизация */
        #auth { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; background: #0e1621; }
        .card { background: var(--side); padding: 30px; border-radius: 20px; width: 90%; max-width: 320px; text-align: center; border: 1px solid var(--border); }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--border); background: #000; color: #fff; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background: var(--accent); border: none; color: white; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; }

        /* Основной экран - Адаптивная сетка */
        #main { display: none; height: 100vh; width: 100vw; flex-direction: row; }

        /* Боковые вкладки (Скрываем на маленьких телефонах для экономии места или уменьшаем) */
        .tabs { width: 70px; background: var(--side); display: flex; flex-direction: column; align-items: center; padding-top: 20px; border-right: 1px solid var(--border); flex-shrink: 0; }
        
        /* Список чатов */
        .chat-list { width: 300px; background: var(--side); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
        
        /* Окно чата */
        .chat-window { flex-grow: 1; display: flex; flex-direction: column; background-size: cover; background-position: center; position: relative; }
        #msgs { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; background: rgba(14, 22, 33, 0.7); }
        
        .msg { background: var(--side); padding: 10px 14px; border-radius: 15px; margin-bottom: 8px; max-width: 85%; border: 1px solid var(--border); word-wrap: break-word; font-size: 15px; }
        .my-msg { align-self: flex-end; background: var(--active); border-color: var(--accent); }

        /* Поле ввода */
        .input-area { padding: 10px; background: var(--side); display: flex; align-items: center; border-top: 1px solid var(--border); }
        .input-area input { margin: 0; margin-right: 10px; flex-grow: 1; }
        .input-area button { width: 60px; padding: 10px; }

        /* Мобильные настройки (Медиа-запросы) */
        @media (max-width: 768px) {
            .tabs { width: 55px; }
            .chat-list { width: 200px; display: none; } /* Скрываем список на мобилках для фокуса на чате */
            /* Чтобы сделать переключение между списком и чатом, нужны доп скрипты, 
               но для начала просто адаптируем размеры под экран */
            .chat-list { display: block; width: 80px; } /* Оставляем только аватарки в списке */
            .chat-list b, .chat-list small { display: none; } 
            .avatar { margin-right: 0; }
        }

        /* Админка и настройки - на весь экран на мобильных */
        .overlay-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--side); z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .admin-user { border-bottom: 1px solid var(--border); padding: 10px 0; display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

    <div id="auth">
        <div class="card">
            <h2>Abobus <span style="color:var(--accent)">BETA</span></h2>
            <input type="text" id="phone" placeholder="Номер">
            <input type="password" id="pass" placeholder="Пароль">
            <button onclick="app.login()">ВОЙТИ</button>
            <p style="font-size: 11px; color: #555; margin-top: 15px;" onclick="app.adminAuth()">🛡️ Разработчик</p>
        </div>
    </div>

    <div id="main">
        <div class="tabs">
            <div class="tab">💬</div>
            <div class="tab" onclick="app.toggleSettings()">⚙️</div>
            <div id="admin-btn" style="display:none; color: gold;" onclick="app.toggleAdmin()">🛡️</div>
            <div style="margin-top:auto; padding-bottom: 20px;" onclick="location.reload()">🚪</div>
        </div>
        
        <div class="chat-list" id="user-list"></div>

        <div class="chat-window" id="chat-bg">
            <div id="msgs"></div>
            <div class="input-area">
                <input type="text" id="m-input" placeholder="Сообщение...">
                <button onclick="app.send()">></button>
            </div>
        </div>
    </div>

    <div id="settings-panel" class="overlay-panel">
        <h2>⚙️ Настройки</h2>
        <input type="text" id="wallpaper-url" placeholder="Ссылка на фон">
        <button onclick="app.saveWallpaper()">Сменить фон</button><br><br>
        <button onclick="app.toggleSettings()">Закрыть</button>
    </div>

    <div id="admin-panel" class="overlay-panel">
        <h2>🛡️ Админ-панель</h2>
        <div id="admin-users-view"></div>
        <button onclick="app.toggleAdmin()">Закрыть</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpycXGblhaM5d4LLF9o5hmXHKluJDre8Q",
            authDomain: "abobus-2dd7a.firebaseapp.com",
            projectId: "abobus-2dd7a",
            storageBucket: "abobus-2dd7a.firebasestorage.app",
            messagingSenderId: "40388975055",
            appId: "1:40388975055:web:b6cb9195e25835381e5aba",
            databaseURL: "https://abobus-2dd7a-default-rtdb.firebaseio.com"
        };

        const fApp = initializeApp(firebaseConfig);
        const db = getDatabase(fApp);
        const ADMIN_PASS = "0000"; 

        window.app = {
            me: null,
            login() {
                const p = document.getElementById('phone').value;
                if(!p) return alert("Введите номер");
                this.me = p.replace(/\D/g, "");

                onValue(ref(db, 'users/' + this.me), (s) => {
                    const u = s.val();
                    if(u && u.banUntil && u.banUntil > Date.now()) {
                        alert("Бан до: " + new Date(u.banUntil).toLocaleTimeString());
                        location.reload();
                    } else if (u && u.banned) {
                        alert("БАН НАВСЕГДА");
                        location.reload();
                    }
                }, { onlyOnce: true });

                set(ref(db, 'users/' + this.me + '/phone'), this.me);
                document.getElementById('auth').style.display = 'none';
                document.getElementById('main').style.display = 'flex';
                this.startSync();
            },

            adminAuth() {
                if(prompt("Пароль:") === ADMIN_PASS) {
                    this.isAdmin = true;
                    document.getElementById('admin-btn').style.display = 'block';
                    this.login();
                }
            },

            send() {
                const val = document.getElementById('m-input').value;
                if(!val) return;
                push(ref(db, 'messages'), { u: this.me, t: val, d: Date.now() });
                document.getElementById('m-input').value = "";
            },

            startSync() {
                onValue(ref(db, 'users'), (s) => {
                    const data = s.val();
                    const list = document.getElementById('user-list');
                    const aList = document.getElementById('admin-users-view');
                    list.innerHTML = ""; aList.innerHTML = "";
                    for(let id in data) {
                        const u = data[id];
                        list.innerHTML += `<div style="padding:10px; text-align:center;"><img src="${u.avatar || 'https://via.placeholder.com/45'}" style="width:45px; border-radius:50%;"><br><b>${u.phone}</b></div>`;
                        aList.innerHTML += `<div class="admin-user">${u.phone} 
                            <button class="ban-btn" onclick="app.setBan('${id}', true)">Бан</button>
                            <button onclick="app.setBan('${id}', false)">Разбан</button>
                        </div>`;
                    }
                });

                onValue(ref(db, 'messages'), (s) => {
                    const box = document.getElementById('msgs');
                    box.innerHTML = "";
                    const data = s.val();
                    for(let id in data) {
                        const m = data[id];
                        box.innerHTML += `<div class="msg ${m.u === this.me ? 'my-msg' : ''}"><b>${m.u}</b><br>${m.t}</div>`;
                    }
                    box.scrollTop = box.scrollHeight;
                });
            },

            saveWallpaper() {
                const url = document.getElementById('wallpaper-url').value;
                document.getElementById('chat-bg').style.backgroundImage = `url('${url}')`;
            },
            toggleAdmin() { const p = document.getElementById('admin-panel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; },
            toggleSettings() { const p = document.getElementById('settings-panel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; },
            setBan(id, state) { update(ref(db, 'users/' + id), { banned: state }); }
        };
    </script>
</body>
</html>
