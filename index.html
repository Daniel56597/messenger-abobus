<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abobus Messages</title>
    <style>
        :root { --bg: #0e1621; --side: #17212b; --active: #2b5278; --txt: #ffffff; --accent: #2481cc; --border: #232e3c; --verify: #00c853; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: var(--txt); font-family: -apple-system, sans-serif; height: 100vh; overflow: hidden; }
        
        /* UI Elements */
        .verify-badge { color: var(--verify); margin-left: 5px; font-size: 14px; }
        .tab-btn { display: flex; flex-direction: column; align-items: center; font-size: 10px; cursor: pointer; color: #888; transition: 0.3s; }
        .tab-btn i { font-size: 20px; margin-bottom: 4px; }
        .tab-btn.active { color: var(--accent); }

        #main { display: none; height: 100vh; display: flex; flex-direction: row; }
        .sidebar { width: 70px; background: var(--side); display: flex; flex-direction: column; align-items: center; padding: 20px 0; border-right: 1px solid var(--border); }
        .content-list { width: 300px; background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        
        /* Chats & Messages */
        .chat-area { flex-grow: 1; display: flex; flex-direction: column; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-blend-mode: overlay; background-color: var(--bg); }
        #msgs { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .msg { background: var(--side); padding: 10px; border-radius: 12px; margin-bottom: 10px; max-width: 80%; }
        .my-msg { align-self: flex-end; background: var(--active); }

        /* Modals */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { background: var(--side); padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; border: 1px solid var(--border); }

        /* Profile items */
        .user-card { padding: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; cursor: pointer; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #444; margin-right: 12px; object-fit: cover; }
        .u-info b { display: block; font-size: 14px; }
        .u-info span { font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

    <div id="auth" style="display: flex; height: 100vh; align-items: center; justify-content: center; flex-direction: column;">
        <div style="background: var(--side); padding: 30px; border-radius: 20px; width: 300px; text-align: center;">
            <h2>Abobus <span style="color: var(--accent)">MESSENGER</span></h2>
            <input type="text" id="login-nick" placeholder="Никнейм (Уникальный)" style="width:100%; padding:10px; margin:5px 0; background:#000; color:#fff; border:1px solid var(--border)">
            <input type="text" id="login-fio" placeholder="Ф.И.О." style="width:100%; padding:10px; margin:5px 0; background:#000; color:#fff; border:1px solid var(--border)">
            <input type="password" id="login-pass" placeholder="Пароль" style="width:100%; padding:10px; margin:5px 0; background:#000; color:#fff; border:1px solid var(--border)">
            <button onclick="app.handleAuth()" style="width:100%; padding:12px; margin-top:10px; background:var(--accent); color:#fff; border:none; border-radius:10px;">Войти / Создать</button>
        </div>
    </div>

    <div id="app-ui" style="display:none; height: 100vh; width: 100vw; display: flex;">
        <div class="sidebar">
            <div class="tab-btn active" onclick="app.view('chats')"><i>💬</i><span>Чаты</span></div><br>
            <div class="tab-btn" onclick="app.view('friends')"><i>👥</i><span>Друзья</span></div><br>
            <div class="tab-btn" onclick="app.view('groups')"><i>📢</i><span>Группы</span></div><br>
            <div class="tab-btn" id="adm-nav" style="display:none" onclick="app.view('admin')"><i>🛡️</i><span>Админ</span></div>
            <div class="tab-btn" style="margin-top:auto" onclick="location.reload()"><i>🚪</i><span>Выход</span></div>
        </div>

        <div class="content-list">
            <div id="list-header" style="padding: 15px; font-weight: bold; border-bottom: 1px solid var(--border);">Мессенджер</div>
            <div id="data-list" style="overflow-y: auto; flex-grow: 1;"></div>
            <button onclick="app.showCreation()" style="padding: 15px; background: var(--active); border: none; color: white;">+ Создать / Добавить</button>
        </div>

        <div class="chat-area">
            <div id="chat-header" style="padding: 15px; background: var(--side); border-bottom: 1px solid var(--border);">Выберите чат</div>
            <div id="msgs"></div>
            <div id="input-wrap" style="padding: 15px; display: flex; background: var(--side);">
                <input type="text" id="m-input" placeholder="Сообщение..." style="flex-grow:1; padding:10px; background:#000; border:1px solid var(--border); color:#fff;">
                <button onclick="app.sendMessage()" style="padding: 10px 20px; background: var(--accent); color: white; border: none; margin-left: 10px;">></button>
            </div>
        </div>
    </div>

    <div id="modal-box" class="modal">
        <div class="modal-content" id="modal-inner"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update, get } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

        // ТВОИ КЛЮЧИ (НЕ МЕНЯЙ)
        const firebaseConfig = {
            apiKey: "AIzaSyCpycXGblhaM5d4LLF9o5hmXHKluJDre8Q",
            authDomain: "abobus-2dd7a.firebaseapp.com",
            projectId: "abobus-2dd7a",
            storageBucket: "abobus-2dd7a.firebasestorage.app",
            messagingSenderId: "40388975055",
            appId: "1:40388975055:web:b6cb9195e25835381e5aba",
            databaseURL: "https://abobus-2dd7a-default-rtdb.firebaseio.com"
        };

        const fApp = initializeApp(firebaseConfig);
        const db = getDatabase(fApp);

        window.app = {
            user: null, currentChat: null,
            
            async handleAuth() {
                const nick = document.getElementById('login-nick').value.toLowerCase();
                const fio = document.getElementById('login-fio').value;
                const pass = document.getElementById('login-pass').value;

                if(nick === 'admin' && pass === 'per82sik') {
                    this.user = { nick: 'admin', fio: 'Гл. Администратор', isAdmin: true };
                } else {
                    const snap = await get(ref(db, 'users/' + nick));
                    if(snap.exists() && snap.val().pass !== pass) return alert("Ник занят или пароль не верен");
                    this.user = { nick, fio, pass, isAdmin: snap.exists() ? snap.val().isAdmin : false };
                    await set(ref(db, 'users/' + nick), this.user);
                }

                document.getElementById('auth').style.display = 'none';
                document.getElementById('app-ui').style.display = 'flex';
                if(this.user.isAdmin) document.getElementById('adm-nav').style.display = 'flex';
                this.view('chats');
            },

            view(type) {
                const list = document.getElementById('data-list');
                list.innerHTML = "Загрузка...";
                if(type === 'chats') this.loadChats();
                if(type === 'friends') this.loadFriends();
                if(type === 'groups') this.loadGroups();
                if(type === 'admin') this.loadAdmin();
            },

            loadChats() {
                onValue(ref(db, 'messages'), (s) => {
                    const list = document.getElementById('data-list');
                    list.innerHTML = `<div class="user-card" onclick="app.openChat('global')">Общий чат</div>`;
                });
            },

            openChat(id) {
                this.currentChat = id;
                document.getElementById('chat-header').innerText = "Чат: " + id;
                onValue(ref(db, 'messages/' + id), (s) => {
                    const msgs = document.getElementById('msgs');
                    msgs.innerHTML = "";
                    const data = s.val();
                    for(let k in data) {
                        const m = data[k];
                        msgs.innerHTML += `<div class="msg ${m.u === this.user.nick ? 'my-msg' : ''}">
                            <small>${m.u}</small><br>${m.t}</div>`;
                    }
                    msgs.scrollTop = msgs.scrollHeight;
                });
            },

            sendMessage() {
                const t = document.getElementById('m-input').value;
                if(!t || !this.currentChat) return;
                push(ref(db, 'messages/' + this.currentChat), { u: this.user.nick, t: t, d: Date.now() });
                document.getElementById('m-input').value = "";
            },

            showCreation() {
                const box = document.getElementById('modal-box');
                const inner = document.getElementById('modal-inner');
                box.style.display = 'flex';
                inner.innerHTML = `
                    <h3>Создать</h3>
                    <button onclick="app.createItem('group')">Новая Группа</button>
                    <button onclick="app.createItem('channel')">Новый Канал</button>
                    <button onclick="app.createItem('friend')">Добавить друга</button>
                    <button onclick="document.getElementById('modal-box').style.display='none'">Отмена</button>
                `;
            },

            async createItem(type) {
                if(type === 'friend') {
                    const nick = prompt("Ник друга:");
                    const snap = await get(ref(db, 'users/' + nick));
                    if(!snap.exists()) return alert("Юзер не найден");
                    await set(ref(db, `friends/${nick}/${this.user.nick}`), { status: 'request', from: this.user.nick });
                    alert("Запрос отправлен!");
                }
                // Аналогично для групп и каналов...
                document.getElementById('modal-box').style.display='none';
            },

            loadAdmin() {
                onValue(ref(db, 'users'), (s) => {
                    const list = document.getElementById('data-list');
                    list.innerHTML = "<b>Юзеры:</b>";
                    const data = s.val();
                    for(let id in data) {
                        list.innerHTML += `<div class="user-card">
                            ${id} ${data[id].verified ? '✅' : ''}
                            <button onclick="app.toggleVerify('${id}')">Галочка</button>
                            <button onclick="app.setAdmin('${id}')">Админ</button>
                        </div>`;
                    }
                });
            },

            toggleVerify(id) {
                get(ref(db, 'users/' + id)).then(s => {
                    update(ref(db, 'users/' + id), { verified: !s.val().verified });
                });
            }
        };
    </script>
</body>
</html>
